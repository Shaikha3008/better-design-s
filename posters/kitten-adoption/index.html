<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winkie Adoption Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #F7F2EA;
    --linen: #EFE6D9;
    --espresso: #2A211B;
    --taupe: #8A7A6B;
    --ginger: #C9773B;
    --rule: #D9CCBB;
  }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e6dccf; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--espresso);
    -webkit-font-smoothing: antialiased;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  .poster {
    width: 210mm; height: 297mm; margin: 0 auto; position: relative; overflow: hidden;
    background:
      radial-gradient(120mm 90mm at 50% 42%, #FBF7F1 0%, rgba(251,247,241,0) 70%),
      var(--ivory);
    display: flex; flex-direction: column; align-items: center;
    padding: 17mm 20mm 15mm;
  }
  /* fine stationery frame */
  .poster::before {
    content: ""; position: absolute; inset: 7mm;
    border: 0.35mm solid var(--rule); border-radius: 1mm; pointer-events: none;
  }

  .eyebrow {
    display: flex; align-items: center; gap: 4mm;
    font-size: 8.5pt; font-weight: 500; letter-spacing: .42em; text-transform: uppercase; color: var(--taupe);
  }
  .eyebrow::before, .eyebrow::after { content: ""; width: 14mm; height: 0.3mm; background: var(--rule); }

  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-style: italic;
    font-size: 104pt; line-height: .86; letter-spacing: -.01em; margin-top: 5mm;
  }
  .sub {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500;
    font-size: 17pt; letter-spacing: .02em; color: var(--taupe); margin-top: 2mm;
  }
  .sub em { color: var(--ginger); }

  .arch {
    margin-top: 8mm; width: 122mm; height: 150mm; position: relative;
  }
  .arch .frame {
    position: absolute; inset: 0; border-radius: 61mm 61mm 3mm 3mm; overflow: hidden;
    box-shadow: 0 6mm 14mm -6mm rgba(70,45,25,.35), 0 1mm 3mm rgba(70,45,25,.12);
  }
  .arch img { width: 100%; height: 100%; object-fit: cover; object-position: 40% 30%; display: block; }
  /* offset outline arch for depth */
  .arch::before {
    content: ""; position: absolute; inset: -3.2mm; border-radius: 64mm 64mm 5mm 5mm;
    border: 0.35mm solid var(--ginger); opacity: .55;
  }

  .traits {
    margin-top: 10mm; display: flex; align-items: center; gap: 6mm;
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: 21pt; letter-spacing: .04em;
  }
  .traits i { width: 1.6mm; height: 1.6mm; border-radius: 50%; background: var(--ginger); display: block; }

  .contact {
    margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 9mm;
    border-top: 0.3mm solid var(--rule); padding-top: 7mm;
  }
  .contact .lbl { font-size: 8pt; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: var(--taupe); }
  .contact .left { text-align: right; }
  .contact .left .v, .contact .right .v { font-family: "Cormorant Garamond", Georgia, serif; font-size: 19pt; font-weight: 600; margin-top: 1mm; }
  .contact .phone {
    text-align: left; padding-left: 9mm; border-left: 0.3mm solid var(--rule);
  }
  .contact .phone .v {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: 30pt; letter-spacing: .03em; line-height: 1.05; margin-top: 1mm; white-space: nowrap; font-variant-numeric: lining-nums;
  }

  @media screen and (max-width: 700px) {
    .poster { width: 100%; height: auto; padding: 14mm 8mm; }
    h1 { font-size: 64pt; } .arch { width: 100%; height: auto; aspect-ratio: 122/150; }
    .contact { grid-template-columns: 1fr; text-align: center; } .contact .left { text-align: center; }
  }
</style>
</head>
<body>
<main class="poster">
  <p class="eyebrow">Up for adoption</p>
  <h1>Winkie</h1>
  <p class="sub">is looking for her <em>forever home</em></p>

  <div class="arch">
    <div class="frame"><img src="photos/winkie.jpg" alt="Winkie, a ginger and white kitten wearing a recovery cone, sitting and looking ahead"></div>
  </div>

  <p class="traits">Playful <i></i> Cuddly <i></i> Healthy</p>

  <section class="contact">
    <div class="left"><p class="lbl">Meet her at</p><p class="v">Arabian Paw Vet</p></div>
    <div class="phone"><p class="lbl">To adopt, call</p><p class="v">050 602 6622</p></div>
  </section>
</main>
</body>
</html>
